# Lives on the scratch repo's default branch (ghr keeps it current); every
# instance is one workflow_dispatch of it with its inputs. Every run sits on the
# default branch, which is what lets the build cache carry from one instance to
# the next: an Actions cache is visible only to runs of its own branch or the
# default branch. Labels here are deliberately bland, see dev/gh_runner/README.md.
name: maintenance
run-name: maintenance ${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      id:
        description: instance
        required: true
        type: string
      image:
        description: runner image
        required: true
        type: string
      os:
        description: linux or macos
        required: true
        type: string
      project:
        description: project directory
        required: true
        type: string
      hostname:
        description: tailnet hostname
        required: true
        type: string
      cache_key:
        description: cache namespace
        required: true
        type: string
      max_minutes:
        description: hard cap
        required: false
        type: string
        default: "180"
      cache_max_gb:
        description: tree size cap for the save
        required: false
        type: string
        default: "24"
      daemon_grace:
        description: minutes to wait for the daemon
        required: false
        type: string
        default: "20"

permissions: {}

concurrency:
  group: maintenance-${{ inputs.id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ${{ inputs.image }}
    timeout-minutes: 360
    env:
      SESSION_OS: ${{ inputs.os }}
      PROJECT: ${{ inputs.project }}
      MAX_MINUTES: ${{ inputs.max_minutes }}
      DAEMON_GRACE: ${{ inputs.daemon_grace }}
      CACHE_MAX_GB: ${{ inputs.cache_max_gb }}
    steps:
      - name: Prepare
        id: mint
        env:
          SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
        run: |
          key=$(curl -fsS -u "${SERVICE_TOKEN}:" -X POST \
            -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:ci"]}}},"expirySeconds":600,"description":"ci-debug runner"}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | jq -r '.key')
          if [ -z "$key" ] || [ "$key" = "null" ]; then
            echo "prepare step failed" >&2
            exit 1
          fi
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Connect
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          authkey: ${{ steps.mint.outputs.key }}
          hostname: ${{ inputs.hostname }}

      - name: Configure
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SERVICE_KEY" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          printf 'ClientAliveInterval 30\nClientAliveCountMax 3\n' | sudo tee -a /etc/ssh/sshd_config >/dev/null
          if [ "$SESSION_OS" = "macos" ]; then
            sudo systemsetup -setremotelogin on
            nohup brew install -q rsync ffmpeg mpv >~/brew.log 2>&1 &
          else
            pkgs="openssh-server mesa-vulkan-drivers libvulkan1 vulkan-tools ffmpeg libasound2-dev pkg-config libmpv-dev"
            sudo apt-get install -y -q $pkgs 2>/dev/null ||
              { sudo apt-get update -q && sudo apt-get install -y -q $pkgs; }
            sudo systemctl enable --now ssh
          fi

      # The main tree (source + target) and the registry, restored before the
      # instance opens so the first build is incremental. Keys are immutable, so
      # the exact key carries the run id and the prefix restore-key picks up the
      # newest previous instance.
      - name: Restore cache
        id: restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/dev/${{ inputs.project }}
          key: ${{ inputs.cache_key }}-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.cache_key }}-

      # What the cache promised versus what arrived. Counts only here; the
      # detail is left on the runner at ~/cache-report.txt.
      - name: Verify
        run: |
          m=~/dev/$PROJECT/CACHE_MANIFEST.txt
          if [ -f "$m" ]; then
            (cd ~ && find "dev/$PROJECT" .cargo/registry -type f 2>/dev/null | sort) > /tmp/now
            comm -23 "$m" /tmp/now > ~/cache-report.txt || true
            echo "manifest $(wc -l < "$m") / present $(wc -l < /tmp/now) / missing $(wc -l < ~/cache-report.txt)"
          else
            echo "no manifest (first run under this key)"
          fi
          # sshd came up several steps ago, so this is the only signal that the
          # restored tree is complete.
          touch ~/.cache_ready

      # Ends on the sentinel the daemon writes (its own activity clock: no job
      # for IDLE minutes, a stop, or its max), so the job finishes CLEANLY and
      # the save step runs; or at MAX_MINUTES; or when the daemon's heartbeat
      # stops; or when no daemon ever arrived within the grace.
      - name: Run
        id: hold
        run: |
          max="$MAX_MINUTES"; grace="$DAEMON_GRACE"
          case "$max" in *[!0-9]*|'') max=180 ;; esac
          case "$grace" in *[!0-9]*|'') grace=20 ;; esac
          [ "$max" -gt 355 ] && max=355
          echo "Session open for up to ${max} minutes."
          ready=$(date +%s); reason=timeout; elapsed=0
          echo $((ready + max * 60)) > "$HOME/.ghr_deadline"
          while :; do
            sleep 5
            if [ -f "$HOME/.gh_runner_stop" ]; then
              reason=$(head -1 "$HOME/.gh_runner_stop" 2>/dev/null); reason=${reason:-stopped}; break
            fi
            now=$(date +%s); elapsed=$(( (now - ready) / 60 ))
            [ "$elapsed" -ge "$max" ] && break
            hb="$HOME/ghr/state/heartbeat"
            if [ -f "$hb" ]; then
              beat=$(head -1 "$hb" 2>/dev/null); case "$beat" in *[!0-9]*|'') beat=$now ;; esac
              [ $((now - beat)) -ge 600 ] && { reason=daemon-dead; break; }
            elif [ "$elapsed" -ge "$grace" ]; then
              reason=no-daemon; break
            fi
          done
          echo "Session over after ${elapsed} minutes (${reason})."
          # Re-saving the restored tree would make it the newest cache and
          # displace a build another instance saved meanwhile.
          built=$(find "$HOME/dev/$PROJECT"/target/*/deps -maxdepth 0 -newer "$HOME/.cache_ready" 2>/dev/null)
          if [ -f "$HOME/.gh_runner_nocache" ]; then
            echo "save=false" >> "$GITHUB_OUTPUT"
            echo "cache save suppressed"
          elif [ -z "$built" ]; then
            echo "save=false" >> "$GITHUB_OUTPUT"
            echo "nothing built since the restore, cache save skipped"
          else
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi

      # Above the size cap the tree is dropped rather than saved: one cold build
      # next instance instead of restoring bloat forever. Then a manifest of what
      # is there, stored inside the cache itself, so a later instance can diff it
      # against what actually came back.
      - name: Snapshot
        if: steps.hold.outputs.save == 'true'
        run: |
          d=~/dev/$PROJECT
          [ -d "$d" ] || exit 0
          gb=$(du -sk "$d" | awk '{printf "%d", $1/1048576}')
          echo "tree: ${gb} GB (cap ${CACHE_MAX_GB})"
          if [ "$gb" -gt "$CACHE_MAX_GB" ]; then
            echo "over the cap — dropping the tree so the next instance builds cold once"
            rm -rf "$d"
            exit 0
          fi
          find "$d" ~/.cargo/registry -type f 2>/dev/null | sed "s|^$HOME/||" | sort > /tmp/manifest
          mv /tmp/manifest "$d/CACHE_MANIFEST.txt"
          echo "manifest: $(wc -l < "$d/CACHE_MANIFEST.txt") files"

      - name: Save cache
        if: steps.hold.outputs.save == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/dev/${{ inputs.project }}
          key: ${{ inputs.cache_key }}-${{ github.run_id }}

      - name: Cleanup
        if: always()
        run: sudo tailscale logout || tailscale logout || true
